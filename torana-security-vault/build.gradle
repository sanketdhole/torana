// torana-security-vault — HashiCorp Vault credential broker

dependencies {
    api project(':torana-core')

    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.vault:spring-vault-core'
    implementation 'com.bettercloud:vault-java-driver:6.2.0'

    testImplementation project(':torana-test')
    testImplementation 'org.springframework.boot:spring-boot-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.testcontainers:vault'
}
