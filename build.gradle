// ─── Root Build — Convention Plugin ──────────────────────────────────────────
// This file defines shared conventions for ALL sub-modules.
// Each sub-module's build.gradle only declares its own dependencies.

plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

// Applied to every sub-project except BOM
subprojects {
    group   = 'com.phaselume.torana'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }

    if (project.name == 'torana-bom') {
        apply plugin: 'java-platform'
        javaPlatform {
            allowDependencies()
        }
    } else {
        apply plugin: 'java-library'
        apply plugin: 'io.spring.dependency-management'

        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(17)
            }
            withSourcesJar()
            withJavadocJar()
        }

        dependencyManagement {
            imports {
                mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.1"
                mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.3"
                mavenBom "org.testcontainers:testcontainers-bom:1.20.0"
            }
        }

        // Lombok + annotation processors shared across all modules
        dependencies {
            compileOnly         libs.lombok
            annotationProcessor libs.lombok
            testCompileOnly     libs.lombok
            testAnnotationProcessor libs.lombok
            testRuntimeOnly     'org.junit.platform:junit-platform-launcher'
        }

        tasks.named('test') {
            useJUnitPlatform()
        }

        // Enforce no-implementation rule in torana-core
        if (project.name == 'torana-core') {
            tasks.named('compileJava') {
                doFirst {
                    // torana-core must not depend on spring-boot-starter-*
                }
            }
        }
    }
}
